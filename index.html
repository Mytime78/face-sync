<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MYTIME PHOTO | ค้นหาภาพถ่ายด้วยใบหน้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-100 text-zinc-900 min-h-screen font-sans antialiased pb-20 selection:bg-red-600 selection:text-white">

  <!-- แถบสีแดงด้านบนสุด -->
  <div class="h-1.5 bg-red-600 w-full"></div>

  <!-- Header -->
  <header class="bg-white border-b border-zinc-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="font-black text-xl tracking-tighter uppercase text-zinc-900">MYTIME</span>
        <span class="text-[10px] bg-red-600 text-white font-bold px-1.5 py-0.5 rounded font-mono uppercase tracking-wider">PHOTO</span>
      </div>
      <div id="aiBadge" class="text-xs border border-zinc-200 rounded-full px-2.5 py-1 bg-zinc-50 flex items-center gap-1.5 text-zinc-500">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> โหลดระบบ AI...
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 mt-6 space-y-4">
    
    <!-- กล่องอัปโหลดภาพสำหรับลูกค้า -->
    <div class="bg-white border border-zinc-200 border-t-4 border-t-red-600 rounded-2xl p-6 shadow-sm space-y-4">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold text-zinc-900">ค้นหาภาพถ่ายของคุณ</h1>
        <p class="text-xs text-zinc-500">ถ่ายเซลฟี่หรือเลือกภาพหน้าตรง ระบบ AI จะค้นหาภาพของคุณจากงานทั้งหมดทันที</p>
      </div>

      <div onclick="document.getElementById('selfieInput').click()" 
           class="group border-2 border-dashed border-zinc-300 hover:border-red-500 bg-zinc-50 hover:bg-red-50/20 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition duration-200">
        <input type="file" id="selfieInput" accept="image/*" class="hidden">
        
        <div id="previewBox" class="w-20 h-20 rounded-full bg-zinc-200 border-2 border-zinc-300 group-hover:border-red-500 overflow-hidden flex items-center justify-center mb-2 transition duration-200">
          <img id="selfiePreview" src="" class="w-full h-full object-cover hidden">
          <svg id="camIcon" class="w-8 h-8 text-zinc-400 group-hover:text-red-500 transition duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </div>

        <p class="text-sm font-semibold text-zinc-800 group-hover:text-red-600 transition">แตะเพื่อถ่ายเซลฟี่ หรือเลือกรูปภาพ</p>
        <p class="text-xs text-zinc-400 mt-0.5">ภาพหน้าตรง ไม่สวมแว่นกันแดด จะได้ผลแม่นยำที่สุด</p>
      </div>

      <button id="searchBtn" disabled 
              class="w-full h-12 bg-zinc-900 hover:bg-black text-white font-semibold text-sm rounded-xl transition shadow-sm disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center gap-2 active:scale-[0.99]">
        <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <span>ค้นหาภาพของฉัน</span>
      </button>

      <div id="statusNotice" class="text-xs text-center min-h-[18px] text-zinc-500 font-medium"></div>
    </div>

    <!-- Gallery แสดงรูป -->
    <div class="space-y-3 pt-2">
      <div class="flex items-center justify-between px-1">
        <h2 id="resultCount" class="text-sm font-bold text-zinc-800">ผลการค้นหา</h2>
        <span class="text-[11px] text-zinc-400 font-mono">Face Landmark AI</span>
      </div>

      <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
    </div>

  </main>

  <!-- Modal ดูภาพใหญ่ พร้อมปุ่มเลื่อน ซ้าย-ขวา -->
  <div id="imageModal" class="fixed inset-0 bg-black/95 backdrop-blur-sm z-50 hidden flex items-center justify-center p-2 sm:p-4 select-none">
    <div class="max-w-3xl w-full bg-zinc-900 rounded-2xl overflow-hidden shadow-2xl border border-zinc-800 relative flex flex-col">
      
      <!-- Top Bar ใน Modal -->
      <div class="p-3 sm:p-3.5 flex justify-between items-center bg-zinc-900/90 border-b border-zinc-800 z-10">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-red-600"></span>
          <span id="modalIndexIndicator" class="text-xs font-semibold text-zinc-300 font-mono">ภาพที่ 1 / 1</span>
        </div>
        <button id="closeModal" class="text-zinc-400 hover:text-white text-lg w-8 h-8 rounded-full hover:bg-zinc-800 flex items-center justify-center transition">✕</button>
      </div>
      
      <!-- พื้นที่รูปภาพ + ปุ่มเลื่อนซ้าย/ขวา -->
      <div id="modalSwipeArea" class="relative p-2 bg-black flex items-center justify-center min-h-[350px] max-h-[70vh] overflow-hidden">
        
        <!-- ปุ่มเลื่อนซ้าย -->
        <button id="prevBtn" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-zinc-900/80 hover:bg-red-600 text-white flex items-center justify-center border border-zinc-700/80 shadow-lg transition z-20 disabled:opacity-20 disabled:hover:bg-zinc-900/80 disabled:cursor-not-allowed">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>

        <img id="modalImg" src="" class="max-h-[65vh] max-w-full object-contain rounded-lg transition-opacity duration-200" alt="Full Preview">

        <!-- ปุ่มเลื่อนขวา -->
        <button id="nextBtn" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-zinc-900/80 hover:bg-red-600 text-white flex items-center justify-center border border-zinc-700/80 shadow-lg transition z-20 disabled:opacity-20 disabled:hover:bg-zinc-900/80 disabled:cursor-not-allowed">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>

      <!-- Footer ใน Modal -->
      <div class="p-3 sm:p-3.5 bg-zinc-900 flex justify-between items-center border-t border-zinc-800 z-10">
        <span id="modalSimilarity" class="text-xs text-red-400 font-mono"></span>
        <a id="modalDownload" href="#" target="_blank" download class="inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white text-xs font-medium px-4 py-2 rounded-lg transition shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>ดาวน์โหลดภาพนี้</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bxvcunvbbgoenfqeurbf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mwtj76Kc6NYUyPB4L0a8rQ_Iehfgtoe";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const targetEvent = urlParams.get('event');

    const selfieInput = document.getElementById('selfieInput');
    const selfiePreview = document.getElementById('selfiePreview');
    const camIcon = document.getElementById('camIcon');
    const searchBtn = document.getElementById('searchBtn');
    const statusNotice = document.getElementById('statusNotice');
    const gallery = document.getElementById('gallery');
    const resultCount = document.getElementById('resultCount');
    const aiBadge = document.getElementById('aiBadge');

    // ตัวแปรสำหรับ Modal Slider
    const imageModal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalDownload = document.getElementById('modalDownload');
    const closeModal = document.getElementById('closeModal');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const modalIndexIndicator = document.getElementById('modalIndexIndicator');
    const modalSimilarity = document.getElementById('modalSimilarity');
    const modalSwipeArea = document.getElementById('modalSwipeArea');

    let isModelLoaded = false;
    let extractedDescriptor = null;
    let currentResults = [];
    let currentIndex = 0;

    async function initAI() {
      try {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        isModelLoaded = true;
        aiBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span> AI พร้อมใช้งาน';
      } catch (err) {
        aiBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> โหลด AI ไม่สำเร็จ';
      }
    }
    initAI();

    function prepareCanvas(file, maxDimension = 640) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxDimension) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            }
          } else {
            if (height > maxDimension) {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    selfieInput.addEventListener('change', async (e) => {
      if (!e.target.files || !e.target.files[0]) return;
      const file = e.target.files[0];

      searchBtn.disabled = true;
      extractedDescriptor = null;
      gallery.innerHTML = '';
      currentResults = [];
      statusNotice.innerText = "⏳ กำลังสแกนใบหน้า...";
      statusNotice.className = "text-xs text-amber-600 animate-pulse";

      try {
        const canvas = await prepareCanvas(file, 500);
        selfiePreview.src = canvas.toDataURL('image/jpeg', 0.9);
        selfiePreview.classList.remove('hidden');
        camIcon.classList.add('hidden');

        if (!isModelLoaded) {
          statusNotice.innerText = "⏳ กำลังโหลดโมเดล AI...";
          await initAI();
        }

        const detection = await faceapi
          .detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
          .withFaceLandmarks(true)
          .withFaceDescriptor();

        if (detection && detection.descriptor) {
          extractedDescriptor = Array.from(detection.descriptor);
          statusNotice.className = "text-xs text-emerald-600 font-semibold";
          statusNotice.innerText = "✅ สแกนใบหน้าเรียบร้อย กดค้นหาได้เลย";
          searchBtn.disabled = false;
        } else {
          statusNotice.className = "text-xs text-rose-600 font-semibold";
          statusNotice.innerText = "⚠️ ไม่พบใบหน้า กรุณาถ่ายหน้าตรงให้เห็นชัดเจน";
        }
      } catch (err) {
        statusNotice.className = "text-xs text-rose-600";
        statusNotice.innerText = "เกิดข้อผิดพลาดในการอ่านไฟล์";
      }
    });

    searchBtn.addEventListener('click', async () => {
      if (!extractedDescriptor) return;

      statusNotice.innerText = "🚀 กำลังค้นหาภาพของคุณจากระบบ...";
      statusNotice.className = "text-xs text-zinc-600 animate-pulse";
      searchBtn.disabled = true;
      gallery.innerHTML = '';
      currentResults = [];

      try {
        let rpcName = targetEvent ? 'match_face' : 'match_face_global';
        let rpcParams = targetEvent 
          ? { query_embedding: extractedDescriptor, target_event: targetEvent, match_threshold: 0.36, match_count: 200 }
          : { query_embedding: extractedDescriptor, match_threshold: 0.36, match_count: 200 };

        const { data, error } = await supabaseClient.rpc(rpcName, rpcParams);

        if (error) throw error;
        searchBtn.disabled = false;
        statusNotice.innerText = "";

        if (data && data.length > 0) {
          currentResults = data;
          resultCount.innerText = `พบภาพถ่ายของคุณทั้งหมด ${data.length} ภาพ`;

          data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = "group border border-zinc-200 hover:border-red-500/50 rounded-xl overflow-hidden bg-white shadow-sm hover:shadow-md transition flex flex-col";
            
            const matchTag = item.similarity 
              ? `<span class="bg-zinc-900 text-white text-[10px] px-1.5 py-0.5 rounded font-mono border border-zinc-700">ตรงกัน ${item.similarity}%</span>` 
              : '';

            const directDownloadUrl = `https://drive.google.com/uc?export=download&id=${item.drive_file_id}`;

            card.innerHTML = `
              <div class="h-40 sm:h-48 overflow-hidden bg-zinc-100 relative cursor-pointer">
                <img src="${item.thumbnail_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                <div class="absolute top-2 left-2">${matchTag}</div>
              </div>
              <div class="p-2 bg-white flex justify-between items-center border-t border-zinc-100">
                <button class="preview-btn text-xs text-zinc-700 hover:text-black font-medium px-2 py-1">
                  ดูรูป
                </button>
                <a href="${directDownloadUrl}" target="_blank" download class="text-xs bg-zinc-100 hover:bg-red-600 hover:text-white text-zinc-800 px-2.5 py-1 rounded transition font-medium">
                  ดาวน์โหลด
                </a>
              </div>
            `;

            card.querySelector('img').addEventListener('click', () => openModalAt(index));
            card.querySelector('.preview-btn').addEventListener('click', () => openModalAt(index));
            gallery.appendChild(card);
          });
        } else {
          resultCount.innerText = "ไม่พบภาพถ่ายที่ตรงกับใบหน้าของคุณ";
        }
      } catch (err) {
        statusNotice.className = "text-xs text-rose-600";
        statusNotice.innerText = `ข้อผิดพลาด: ${err.message}`;
        searchBtn.disabled = false;
      }
    });

    // ฟังก์ชันเปิดและอัปเดตสถานะใน Modal
    function openModalAt(index) {
      if (!currentResults || currentResults.length === 0) return;
      currentIndex = index;
      updateModalView();
      imageModal.classList.remove('hidden');
    }

    function updateModalView() {
      const item = currentResults[currentIndex];
      if (!item) return;

      modalImg.style.opacity = '0.3';
      modalImg.src = `https://lh3.googleusercontent.com/d/${item.drive_file_id}=s1600`;
      modalImg.onload = () => { modalImg.style.opacity = '1'; };

      modalDownload.href = `https://drive.google.com/uc?export=download&id=${item.drive_file_id}`;
      modalIndexIndicator.innerText = `ภาพที่ ${currentIndex + 1} / ${currentResults.length}`;
      modalSimilarity.innerText = item.similarity ? `ความเหมือน ${item.similarity}%` : '';

      // ปิดใช้งานปุ่มเมื่อถึงขอบซ้ายหรือขวาสุด
      prevBtn.disabled = (currentIndex === 0);
      nextBtn.disabled = (currentIndex === currentResults.length - 1);
    }

    function showPrevImage() {
      if (currentIndex > 0) {
        currentIndex--;
        updateModalView();
      }
    }

    function showNextImage() {
      if (currentIndex < currentResults.length - 1) {
        currentIndex++;
        updateModalView();
      }
    }

    prevBtn.addEventListener('click', showPrevImage);
    nextBtn.addEventListener('click', showNextImage);

    // รองรับปุ่มลูกศรคีย์บอร์ด (Left / Right / Escape)
    window.addEventListener('keydown', (e) => {
      if (imageModal.classList.contains('hidden')) return;
      if (e.key === 'ArrowLeft') showPrevImage();
      if (e.key === 'ArrowRight') showNextImage();
      if (e.key === 'Escape') closeModalAction();
    });

    // รองรับการปัดจอ Touch Swipe ซ้าย-ขวา บนมือถือ
    let touchStartX = 0;
    let touchEndX = 0;

    modalSwipeArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    modalSwipeArea.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;
      if (Math.abs(swipeDistance) > 45) {
        if (swipeDistance > 0) {
          showPrevImage(); // ปัดขวา = ดูภาพก่อนหน้า
        } else {
          showNextImage(); // ปัดซ้าย = ดูภาพถัดไป
        }
      }
    }

    function closeModalAction() {
      imageModal.classList.add('hidden');
      modalImg.src = "";
    }

    closeModal.addEventListener('click', closeModalAction);
    imageModal.addEventListener('click', (e) => { 
      if (e.target === imageModal) closeModalAction();
    });
  </script>
</body>
</html>
